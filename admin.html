<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d35c8"><title>Painel Administrativo | Pingo Locações</title>
<style>
:root{--p:#6d35c8;--pd:#48218e;--pink:#ff2388;--ink:#27213a;--muted:#706b7d;--line:#e9e2f4;--soft:#f7f4ff;--good:#14804a;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8f6fc;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#ffe0f0,transparent 35%),linear-gradient(135deg,#f5edff,#fff)}.login{width:min(430px,100%);background:white;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 20px 60px #32124b1a}.brand{font-weight:950;font-size:25px;color:var(--pd)}.brand span{color:var(--pink)}.sub{color:var(--muted);font-size:13px;line-height:1.5}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:11px;padding:11px;background:white;min-width:0;width:100%}.field textarea{min-height:75px;resize:vertical}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:850}.primary{background:var(--pink);color:white}.secondary{background:#efe7ff;color:var(--pd)}.outline{border:1px solid var(--line);background:white;color:var(--ink)}.danger{background:#fff0ef;color:var(--bad)}.full{width:100%}.error{color:var(--bad);font-size:12px;white-space:pre-wrap}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:240px;background:var(--pd);color:white;padding:22px 14px;display:flex;flex-direction:column;gap:7px}.sidebar .brand{color:white;padding:4px 10px 20px}.sidebar .brand span{color:#ff9bc8}.sidebtn{border:0;text-align:left;background:transparent;color:#e8dcff;padding:12px;border-radius:10px;font-weight:750}.sidebtn.active,.sidebtn:hover{background:#ffffff20;color:white}.sidefoot{margin-top:auto;color:#d8c8f0;font-size:11px;padding:10px}.main{margin-left:240px;padding:24px;max-width:1500px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.topbar h1{font-size:25px;margin:0}.topbar p{margin:4px 0 0;color:var(--muted);font-size:12px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat strong{font-size:26px;color:var(--pd);display:block}.stat span{font-size:12px;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.section-title h2{font-size:18px;margin:0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:10px;padding:10px;background:white}.toolbar input{flex:1;min-width:180px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px}td .actions{display:flex;gap:5px;flex-wrap:wrap}.thumb{width:46px;height:42px;object-fit:cover;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:22px}.badge{display:inline-block;padding:4px 7px;border-radius:20px;background:#e6f7ed;color:var(--good);font-size:10px;font-weight:800}.badge.off{background:#f2edf8;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.field.fullrow{grid-column:1/-1}.muted{color:var(--muted);font-size:12px}.notice{background:#fff8df;border-radius:10px;padding:10px;font-size:12px;line-height:1.5;margin:12px 0}.toast{position:fixed;right:18px;bottom:18px;background:#25143e;color:white;padding:12px 16px;border-radius:12px;box-shadow:0 8px 25px #0002;z-index:20;max-width:calc(100% - 36px)}.modalback{position:fixed;inset:0;background:#1b0f2daa;display:grid;place-items:center;padding:15px;z-index:10}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:white;border-radius:18px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.modalhead h2{margin:0;font-size:20px}.close{border:0;border-radius:9px;background:var(--soft);padding:8px 12px}.mobile-menu{display:none}@media(max-width:800px){.sidebar{width:72px;padding:14px 8px}.sidebar .brand{font-size:0;padding:8px}.sidebar .brand:after{content:'💜';font-size:22px}.sidebtn{font-size:0;text-align:center;padding:12px 4px}.sidebtn:before{font-size:18px}.sidebtn[data-page=dashboard]:before{content:'▦'}.sidebtn[data-page=products]:before{content:'📦'}.sidebtn[data-page=categories]:before{content:'🏷️'}.sidebtn[data-page=sellers]:before{content:'👥'}.sidebtn[data-page=settings]:before{content:'⚙️'}.sidefoot{font-size:0;padding:0}.main{margin-left:72px;padding:15px}.stats{grid-template-columns:1fr}.topbar h1{font-size:20px}.formgrid{grid-template-columns:1fr}.field.fullrow{grid-column:auto}}@media(max-width:480px){.main{padding:10px}.card{padding:12px}.topbar{align-items:flex-start}.topbar .btn{padding:8px;font-size:11px}}
</style></head><body>
<div id="loginView" class="login-wrap"><form class="login" id="loginForm"><div class="brand">Pingo <span>Locações</span></div><h1 style="font-size:23px;margin:20px 0 5px">Painel administrativo</h1><p class="sub">Entre com seu usuário autorizado para gerenciar o catálogo.</p><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required value=""></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary full" type="submit" id="loginBtn">Entrar no painel</button><p id="loginError" class="error"></p><p class="muted">Acesso restrito à conta autorizada no Supabase.</p><a href="/" class="muted">← Voltar ao catálogo</a></form></div>
<div id="appView" class="app hidden"><aside class="sidebar"><div class="brand">Pingo <span>Locações</span></div><button class="sidebtn active" data-page="dashboard">Visão geral</button><button class="sidebtn" data-page="products">Produtos</button><button class="sidebtn" data-page="categories">Categorias</button><button class="sidebtn" data-page="sellers">Vendedoras / WhatsApps</button><button class="sidebtn" data-page="settings">Configurações</button><div class="sidefoot">Painel privado · Pingo Locações</div></aside><main class="main"><div class="topbar"><div><h1 id="pageTitle">Visão geral</h1><p id="signedInAs"></p></div><button class="btn outline" id="logoutBtn">Sair</button></div><div id="pageContent"></div></main></div>
<div id="modalHost"></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://wlsmzfdhfhbkrxrriqsi.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_8TrlfTZ9X9FS_zo1cGxcxg_ELNYIg6m';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const ADMIN_EMAIL='pilarestoo@gmail.com';let currentUser=null,products=[],categories=[],sellers=[],page='dashboard';
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>v==null?'Sob consulta':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v));
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3200)}
async function isAdmin(user){if(!user||user.email?.toLowerCase()!==ADMIN_EMAIL)return false;const {data,error}=await sb.from('catalog_admins').select('user_id,active').eq('user_id',user.id).eq('active',true).maybeSingle();return !error&&!!data}
async function showApp(user){currentUser=user;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('signedInAs').textContent=user.email;await refreshData();renderPage('dashboard')}
async function refreshData(){const [p,c,s]=await Promise.all([sb.from('catalog_products').select('*').order('sort_order'),sb.from('catalog_categories').select('*').order('sort_order'),sb.from('catalog_sellers').select('*').order('sort_order')]);if(p.error)throw p.error;if(c.error)throw c.error;if(s.error)throw s.error;products=p.data||[];categories=c.data||[];sellers=s.data||[]}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';$('loginBtn').disabled=true;$('loginBtn').textContent='Verificando...';try{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(!(await isAdmin(data.user))){await sb.auth.signOut();throw new Error('Esta conta não está autorizada como administradora. Execute primeiro o SQL de configuração e confira o e-mail autorizado.')}await showApp(data.user)}catch(err){$('loginError').textContent=err.message||'Não foi possível entrar.'}finally{$('loginBtn').disabled=false;$('loginBtn').textContent='Entrar no painel'}});
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();currentUser=null;$('appView').classList.add('hidden');$('loginView').classList.remove('hidden')};document.querySelectorAll('.sidebtn').forEach(b=>b.onclick=()=>renderPage(b.dataset.page));
const titles={dashboard:'Visão geral',products:'Produtos',categories:'Categorias',sellers:'Vendedoras e WhatsApps',settings:'Configurações'};
function renderPage(which){page=which;$('pageTitle').textContent=titles[which];document.querySelectorAll('.sidebtn').forEach(b=>b.classList.toggle('active',b.dataset.page===which));if(which==='dashboard')renderDashboard();if(which==='products')renderProducts();if(which==='categories')renderCategories();if(which==='sellers')renderSellers();if(which==='settings')renderSettings()}
function renderDashboard(){$('pageContent').innerHTML=`<div class="stats"><div class="card stat"><strong>${products.length}</strong><span>Produtos cadastrados</span></div><div class="card stat"><strong>${products.filter(p=>p.active).length}</strong><span>Produtos ativos no catálogo</span></div><div class="card stat"><strong>${sellers.filter(s=>s.active).length}</strong><span>Vendedoras ativas</span></div></div><div class="card"><h2>Bem-vindo ao painel 💜</h2><p class="sub">Gerencie os produtos, preços, fotos, categorias e contatos que aparecem no catálogo público.</p><div class="notice">As alterações salvas aqui são gravadas no Supabase. Produtos inativos deixam de aparecer para clientes. As vendedoras inativas deixam de aparecer na seleção do orçamento.</div><button class="btn primary" onclick="renderPage('products')">Gerenciar produtos</button> <button class="btn secondary" onclick="renderPage('sellers')">Gerenciar vendedoras</button></div>`}
function renderProducts(){const cats=categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');$('pageContent').innerHTML=`<div class="card"><div class="section-title"><h2>Catálogo de produtos</h2><button class="btn primary" onclick="editProduct()">+ Novo produto</button></div><div class="toolbar"><input id="productSearch" placeholder="Buscar por nome ou categoria..." oninput="filterProducts()"><select id="productStatus" onchange="filterProducts()"><option value="all">Todos os status</option><option value="true">Ativos</option><option value="false">Inativos</option></select></div><div class="table-wrap"><table><thead><tr><th>Foto</th><th>Produto</th><th>Categoria</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead><tbody id="productRows"></tbody></table></div></div>`;filterProducts()}
function filterProducts(){const q=($('productSearch')?.value||'').toLowerCase();const status=$('productStatus')?.value||'all';const rows=products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(q)&&(status==='all'||String(p.active)===status));$('productRows').innerHTML=rows.map(p=>`<tr><td>${p.image_url?`<img class="thumb" src="${esc(p.image_url)}" alt="">`:`<div class="thumb">${esc(p.emoji||'🎉')}</div>`}</td><td><b>${esc(p.name)}</b><div class="muted">${esc(p.unit||'sob consulta')}</div></td><td>${esc(categories.find(c=>c.id===p.category)?.name||p.category)}</td><td>${money(p.price)}</td><td><span class="badge ${p.active?'':'off'}">${p.active?'Ativo':'Inativo'}</span></td><td><div class="actions"><button class="btn secondary" onclick="editProduct(${p.id})">Editar</button><button class="btn ${p.active?'danger':'secondary'}" onclick="toggleProduct(${p.id},${!p.active})">${p.active?'Desativar':'Ativar'}</button></div></td></tr>`).join('')||'<tr><td colspan="6">Nenhum produto encontrado.</td></tr>'}
function editProduct(id=null){const p=id?products.find(x=>x.id===id):{name:'',category:categories[0]?.id||'brinquedos',emoji:'🎉',description:'',price:null,old_price:null,unit:'sob consulta',tag:'',image_url:'',active:true,sort_order:products.length};const catOpts=categories.map(c=>`<option value="${esc(c.id)}" ${c.id===p.category?'selected':''}>${esc(c.name)}</option>`).join('');$('modalHost').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${id?'Editar produto':'Novo produto'}</h2><button class="close" onclick="closeModal()">✕</button></div><form id="productForm"><div class="formgrid"><div class="field"><label>Nome *</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>Categoria *</label><select name="category" required>${catOpts}</select></div><div class="field"><label>Ícone / emoji</label><input name="emoji" value="${esc(p.emoji||'🎉')}"></div><div class="field"><label>Unidade</label><input name="unit" value="${esc(p.unit||'sob consulta')}" placeholder="diária, combo, até 4h..."></div><div class="field"><label>Preço atual (deixe vazio para sob consulta)</label><input name="price" type="number" min="0" step="0.01" value="${p.price??''}"></div><div class="field"><label>Preço anterior (opcional)</label><input name="old_price" type="number" min="0" step="0.01" value="${p.old_price??''}"></div><div class="field"><label>Etiqueta</label><input name="tag" value="${esc(p.tag||'')}" placeholder="Destaque, promoção..."></div><div class="field"><label>Ordem de exibição</label><input name="sort_order" type="number" step="1" value="${p.sort_order??0}"></div><div class="field fullrow"><label>Descrição</label><textarea name="description">${esc(p.description||'')}</textarea></div><div class="field fullrow"><label>Foto do produto</label><input name="photo" type="file" accept="image/*"><small class="muted">${p.image_url?'Já existe uma foto. Selecione outra para substituir.':'Envie uma imagem JPG, PNG ou WebP.'}</small></div><div class="field fullrow"><label><input name="active" type="checkbox" ${p.active?'checked':''} style="width:auto"> Produto ativo no catálogo</label></div></div><p class="error" id="productError"></p><button class="btn primary full" type="submit">Salvar produto</button></form></div></div>`;$('productForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;const fd=new FormData(f);const payload={name:String(fd.get('name')).trim(),category:String(fd.get('category')),emoji:String(fd.get('emoji')||'🎉'),description:String(fd.get('description')||''),price:fd.get('price')===''?null:Number(fd.get('price')),old_price:fd.get('old_price')===''?null:Number(fd.get('old_price')),unit:String(fd.get('unit')||'sob consulta'),tag:String(fd.get('tag')||''),active:f.elements.active.checked,sort_order:Number(fd.get('sort_order')||0),updated_at:new Date().toISOString()};try{const file=f.elements.photo.files[0];if(file){if(file.size>5*1024*1024)throw new Error('A imagem deve ter no máximo 5 MB.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`products/${crypto.randomUUID()}.${ext}`;const {error:upErr}=await sb.storage.from('catalog-images').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(upErr)throw upErr;const {data:urlData}=sb.storage.from('catalog-images').getPublicUrl(path);payload.image_url=urlData.publicUrl}let result;if(id)result=await sb.from('catalog_products').update(payload).eq('id',id);else result=await sb.from('catalog_products').insert(payload);if(result.error)throw result.error;await refreshData();closeModal();renderProducts();toast('Produto salvo com sucesso.')}catch(err){$('productError').textContent=err.message||'Erro ao salvar produto.'}}}
async function toggleProduct(id,active){if(!confirm(`${active?'Ativar':'Desativar'} este produto?`))return;const {error}=await sb.from('catalog_products').update({active,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast('Erro: '+error.message);await refreshData();renderProducts();toast('Status atualizado.')}
function renderCategories(){$('pageContent').innerHTML=`<div class="card"><div class="section-title"><h2>Categorias do catálogo</h2><button class="btn primary" onclick="editCategory()">+ Nova categoria</button></div><p class="sub">Categorias ativas aparecem no catálogo público. Desativar não apaga os produtos cadastrados.</p><div class="table-wrap"><table><thead><tr><th>Ícone</th><th>Nome</th><th>ID</th><th>Ordem</th><th>Status</th><th>Ações</th></tr></thead><tbody>${categories.map(c=>`<tr><td style="font-size:22px">${esc(c.emoji||'🎉')}</td><td><b>${esc(c.name)}</b><div class="muted">${esc(c.description||'')}</div></td><td>${esc(c.id)}</td><td>${c.sort_order}</td><td><span class="badge ${c.active?'':'off'}">${c.active?'Ativa':'Inativa'}</span></td><td><div class="actions"><button class="btn secondary" onclick="editCategory('${esc(c.id)}')">Editar</button><button class="btn ${c.active?'danger':'secondary'}" onclick="toggleCategory('${esc(c.id)}',${!c.active})">${c.active?'Desativar':'Ativar'}</button></div></td></tr>`).join('')||'<tr><td colspan="6">Nenhuma categoria.</td></tr>'}</tbody></table></div></div>`}
function editCategory(id=null){const c=id?categories.find(x=>x.id===id):{id:'',name:'',emoji:'🎉',description:'',active:true,sort_order:categories.length};$('modalHost').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${id?'Editar categoria':'Nova categoria'}</h2><button class="close" onclick="closeModal()">✕</button></div><form id="categoryForm"><div class="field"><label>ID (sem espaços, ex.: materiais) *</label><input name="id" required pattern="[a-z0-9_-]+" ${id?'readonly':''} value="${esc(c.id)}"></div><div class="field"><label>Nome *</label><input name="name" required value="${esc(c.name)}"></div><div class="field"><label>Emoji</label><input name="emoji" value="${esc(c.emoji||'🎉')}"></div><div class="field"><label>Descrição</label><input name="description" value="${esc(c.description||'')}"></div><div class="field"><label>Ordem</label><input name="sort_order" type="number" value="${c.sort_order||0}"></div><div class="field"><label><input name="active" type="checkbox" ${c.active?'checked':''} style="width:auto"> Ativa no catálogo</label></div><p class="error" id="categoryError"></p><button class="btn primary full">Salvar categoria</button></form></div></div>`;$('categoryForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f),payload={id:String(fd.get('id')).trim(),name:String(fd.get('name')).trim(),emoji:String(fd.get('emoji')||'🎉'),description:String(fd.get('description')||''),sort_order:Number(fd.get('sort_order')||0),active:f.elements.active.checked};try{const r=id?await sb.from('catalog_categories').update({name:payload.name,emoji:payload.emoji,description:payload.description,sort_order:payload.sort_order,active:payload.active}).eq('id',id):await sb.from('catalog_categories').insert(payload);if(r.error)throw r.error;await refreshData();closeModal();renderCategories();toast('Categoria salva.')}catch(err){$('categoryError').textContent=err.message}}}
async function toggleCategory(id,active){if(!confirm(`${active?'Ativar':'Desativar'} categoria?`))return;const {error}=await sb.from('catalog_categories').update({active}).eq('id',id);if(error)return toast('Erro: '+error.message);await refreshData();renderCategories();toast('Status atualizado.')}
function renderSellers(){$('pageContent').innerHTML=`<div class="card"><div class="section-title"><h2>Vendedoras e direcionamento do WhatsApp</h2><button class="btn primary" onclick="editSeller()">+ Adicionar vendedora</button></div><p class="sub">Use o número completo com código do país e DDD, somente números. Exemplo: 5545998035269.</p><div class="table-wrap"><table><thead><tr><th>Nome</th><th>WhatsApp</th><th>Ordem</th><th>Status</th><th>Ações</th></tr></thead><tbody>${sellers.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.whatsapp)}</td><td>${s.sort_order}</td><td><span class="badge ${s.active?'':'off'}">${s.active?'Ativa':'Inativa'}</span></td><td><div class="actions"><button class="btn secondary" onclick="editSeller('${esc(s.id)}')">Editar</button><button class="btn ${s.active?'danger':'secondary'}" onclick="toggleSeller('${esc(s.id)}',${!s.active})">${s.active?'Remover da lista':'Reativar'}</button></div></td></tr>`).join('')||'<tr><td colspan="5">Nenhuma vendedora cadastrada.</td></tr>'}</tbody></table></div><div class="notice">Remover da lista desativa a vendedora para novos orçamentos, sem apagar o cadastro nem o histórico.</div></div>`}
function editSeller(id=null){const s=id?sellers.find(x=>x.id===id):{name:'',whatsapp:'',active:true,sort_order:sellers.length};$('modalHost').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${id?'Editar vendedora':'Adicionar vendedora'}</h2><button class="close" onclick="closeModal()">✕</button></div><form id="sellerForm"><div class="field"><label>Nome *</label><input name="name" required value="${esc(s.name)}"></div><div class="field"><label>WhatsApp com país + DDD, só números *</label><input name="whatsapp" required inputmode="numeric" pattern="[0-9]{12,15}" placeholder="5545998035269" value="${esc(s.whatsapp)}"></div><div class="field"><label>Ordem na lista</label><input name="sort_order" type="number" value="${s.sort_order||0}"></div><div class="field"><label><input name="active" type="checkbox" ${s.active?'checked':''} style="width:auto"> Mostrar no catálogo</label></div><p class="error" id="sellerError"></p><button class="btn primary full">Salvar vendedora</button></form></div></div>`;$('sellerForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f),payload={name:String(fd.get('name')).trim(),whatsapp:String(fd.get('whatsapp')).replace(/\D/g,''),sort_order:Number(fd.get('sort_order')||0),active:f.elements.active.checked};try{const r=id?await sb.from('catalog_sellers').update(payload).eq('id',id):await sb.from('catalog_sellers').insert(payload);if(r.error)throw r.error;await refreshData();closeModal();renderSellers();toast('Vendedora salva.')}catch(err){$('sellerError').textContent=err.message}}}
async function toggleSeller(id,active){if(!confirm(`${active?'Reativar':'Remover da lista'} esta vendedora? O cadastro será preservado.`))return;const {error}=await sb.from('catalog_sellers').update({active}).eq('id',id);if(error)return toast('Erro: '+error.message);await refreshData();renderSellers();toast(active?'Vendedora reativada.':'Vendedora removida da lista.')}
function renderSettings(){$('pageContent').innerHTML=`<div class="card"><h2>Configurações do catálogo</h2><p class="sub">Projeto Supabase conectado: pingo catálogo.</p><p><b>Administrador:</b> ${esc(currentUser?.email)}</p><p><b>WhatsApp principal atual:</b> (45) 99803-5269</p><p class="muted">O painel só permite acesso à conta autorizada na tabela catalog_admins. Para adicionar outra pessoa como administradora, configure isso separadamente; cadastrar uma vendedora não concede acesso ao painel.</p><div class="notice">Fotos enviadas vão para o bucket público catalog-images. A chave publishable do Supabase pode estar no navegador; nunca coloque a service_role/secret key neste arquivo.</div><a class="btn secondary" href="/">Abrir catálogo público ↗</a></div>`}
function closeModal(){$('modalHost').innerHTML=''}
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session){try{if(await isAdmin(session.user))await showApp(session.user);else await sb.auth.signOut()}catch(e){console.error(e)}}})();
</script></body></html>
